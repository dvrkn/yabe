[package]
name = "yabe-gitops"
description = "GitOps organizer"
repository = "https://github.com/dvrkn/yabe"
readme = "README.md"
version = "0.1.10"
edition = "2021"
keywords = ["gitops", "kubernetes", "argocd", "yaml", "helm"]
license = "MIT"

[[bin]]
name = "yabe"
path = "src/main.rs"

[lib]
name = "yabe"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.27"
yaml-rust2 = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_yml = "0.0.12"
glob = "0.3.2"
