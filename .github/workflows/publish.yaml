name: Publish to crates.io

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
      
      - name: Verify version matches tag
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION=${{ steps.get_version.outputs.version }}
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Git tag version: $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: Cargo.toml has $CARGO_VERSION but tag is $TAG_VERSION"
            exit 1
          fi
          echo "✅ Version matches tag"
      
      - name: Generate changelog for release
        id: changelog
        run: |
          # Extract the changelog section for this version
          if [ -f "CHANGELOG.md" ]; then
            # Use awk to extract the section between the current version and the next version
            CHANGELOG_SECTION=$(awk "/^## \[${{ steps.get_version.outputs.version }}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
            
            # If no section found, generate from git commits
            if [ -z "$CHANGELOG_SECTION" ]; then
              echo "No changelog section found for version ${{ steps.get_version.outputs.version }}"
              echo "Generating changelog from git commits..."
              
              # Get the previous tag
              PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
              
              if [ -n "$PREVIOUS_TAG" ]; then
                CHANGELOG_SECTION="### Changes since $PREVIOUS_TAG"$'\n'$'\n'$(git log --oneline --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
              else
                CHANGELOG_SECTION="### Changes in this release"$'\n'$'\n'$(git log --oneline --pretty=format:"- %s (%h)" -n 10)
              fi
            fi
          else
            echo "No CHANGELOG.md found, generating from git commits..."
            
            # Get the previous tag
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            
            if [ -n "$PREVIOUS_TAG" ]; then
              CHANGELOG_SECTION="### Changes since $PREVIOUS_TAG"$'\n'$'\n'$(git log --oneline --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
            else
              CHANGELOG_SECTION="### Changes in this release"$'\n'$'\n'$(git log --oneline --pretty=format:"- %s (%h)" -n 10)
            fi
          fi
          
          # Store changelog in GitHub output using heredoc to handle multiline content
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Generated changelog for release page"
      
      - name: Update release with changelog
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          append_body: true
      
      - name: Run tests
        run: cargo test
      
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "📦 Publishing to crates.io..."
          cargo publish --no-verify
          echo "✅ Successfully published to crates.io"
