on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - .github/**

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Release Build
        run: cargo build --release
      - name: Cargo test
        run: cargo test
      - name: Test examples
        run: ./test-examples.sh
      - name: Check artifact weight
        run: ls -lh target/release/
